---
# Decides whether the host can run ROCm. Runs before any change. Inputs (set by gather.yml or a unit check):
# rocm_pci_devices (list of {vendor, device, class} as in sysfs), rocm_secure_boot_enabled, rocm_os_codename.
- name: Reset the supported GPU list
  ansible.builtin.set_fact:
    rocm_supported_gpus: []

- name: Select the supported AMD display devices
  ansible.builtin.set_fact:
    rocm_supported_gpus: "{{ rocm_supported_gpus + [item] }}"
  loop: "{{ rocm_pci_devices }}"
  loop_control:
    label: "{{ item.vendor }}:{{ item.device }} {{ item['class'] }}"
  when:
    - item.vendor | lower == '0x1002'
    - item['class'] | lower is match('0x03')
    - (item.device | lower | regex_replace('^0x', ''))
      in (rocm_supported_pci_ids | map('lower') | map('regex_replace', '^0x', '') | list)

- name: Check for a supported AMD GPU
  ansible.builtin.assert:
    that: rocm_supported_gpus | length > 0
    fail_msg: >-
      No supported AMD GPU found. AMD display devices:
      {{ rocm_pci_devices | selectattr('vendor', 'equalto', '0x1002') | selectattr('class', 'match', '0x03')
         | map(attribute='device') | list }}. Add the device id to rocm_supported_pci_ids only if
      the ROCm system requirements list the GPU.
    success_msg: "Supported AMD GPUs: {{ rocm_supported_gpus | map(attribute='device') | list }}"

- name: Check that Secure Boot is disabled
  ansible.builtin.assert:
    that: not (rocm_secure_boot_enabled | bool)
    fail_msg: Secure Boot is enabled. The unsigned amdgpu DKMS module would not load. Disable Secure Boot first.
    quiet: true

- name: Check the OS release
  ansible.builtin.assert:
    that: rocm_os_codename == 'resolute'
    fail_msg: "This role supports Ubuntu 26.04 (resolute) only, found {{ rocm_os_codename }}."
    quiet: true
