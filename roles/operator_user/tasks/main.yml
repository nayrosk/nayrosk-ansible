---
- name: Create the operator group
  ansible.builtin.group:
    name: "{{ operator_user_name }}"
    gid: "{{ operator_user_gid }}"
    state: present

- name: Create the operator user
  ansible.builtin.user:
    name: "{{ operator_user_name }}"
    uid: "{{ operator_user_uid }}"
    group: "{{ operator_user_name }}"
    home: "{{ operator_user_home }}"
    shell: "{{ operator_user_shell }}"
    create_home: true
    password_lock: true
    state: present

# Tasks run as the operator (rootless Caddy) need a temporary directory in its home. With pipelining, the
# first module that needs it creates it and warns about it: create it beforehand.
- name: Create the Ansible temporary directory of the operator
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ operator_user_name }}"
    group: "{{ operator_user_name }}"
    mode: "0700"
  loop:
    - "{{ operator_user_home }}/.ansible"
    - "{{ operator_user_home }}/.ansible/tmp"

- name: Allow the operator passwordless sudo
  ansible.builtin.copy:
    content: "{{ operator_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/90-{{ operator_user_name }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Authorize the operator SSH key
  ansible.posix.authorized_key:
    user: "{{ operator_user_name }}"
    key: "{{ operator_user_public_key }}"
    exclusive: true
    state: present

- name: Check whether lingering is enabled for the operator
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ operator_user_name }}"
  register: operator_user_linger

# Gated by the stat above rather than creates: so that changed_when can state the change explicitly.
- name: Enable systemd lingering for the operator
  ansible.builtin.command: "loginctl enable-linger {{ operator_user_name }}"
  changed_when: true
  when: not operator_user_linger.stat.exists

# A bootstrap user other than root reaches the operator through sudo, and Ansible cannot hand its temporary
# files to the operator for tasks that become it (rootless Caddy). The operator key works from here, so move
# the rest of the play to the operator now, as ssh_hardening does later for root. The probe is the one of
# bootstrap_connection: key only, batch mode, never a password. bootstrap_connection set the connection
# variables with set_fact, which outranks task vars: the operator account is passed as include parameters,
# the only scoped variables that outrank facts.
# The condition is fixed in a fact first: the include parameters below change ansible_user, and the block
# condition is evaluated again for the included tasks.
- name: Decide whether the play moves to the operator
  ansible.builtin.set_fact:
    operator_user_handover: >-
      {{ bootstrap_connection_mode | default('') == 'bootstrap'
         and ansible_user not in ['root', operator_user_name] }}

- name: Move the play to the operator after a non-root bootstrap user
  when: operator_user_handover | bool
  block:
    - name: Probe the operator key login
      ansible.builtin.include_tasks: probe.yml
      vars:
        ansible_user: "{{ operator_user_name }}"
        ansible_password: ""
        ansible_become: false
        ansible_become_password: ""
        ansible_ssh_common_args: >-
          {{ hostvars[inventory_hostname].ansible_ssh_common_args | default('') }}
          -o PreferredAuthentications=publickey -o BatchMode=yes

    - name: Check the operator key login works
      ansible.builtin.assert:
        that:
          - operator_user_probe is defined
          - operator_user_probe is not skipped
          - not (operator_user_probe.unreachable | default(false))
        fail_msg: >-
          {{ operator_user_name }} cannot log in with the key from the controller: check operator_public_key
          and the controller key.
        quiet: true

    - name: Use the operator with become
      ansible.builtin.set_fact:
        ansible_user: "{{ operator_user_name }}"
        ansible_password: ""
        ansible_become: true
        ansible_become_password: ""
        ansible_become_exe: sudo

# meta tasks cannot be conditional: the reset is harmless when the connection is unchanged.
- name: Reset the connection to use the operator account
  ansible.builtin.meta: reset_connection
