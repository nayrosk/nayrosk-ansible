---
# Rules first, enable last: the SSH rule exists before UFW starts filtering, so the current session survives.
- name: Deny incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow the configured ports and applications
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    name: "{{ item.name | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_rules }}"
  loop_control:
    label: "{{ item.comment | default(item.name | default(item.port)) }}"

# UFW applies /etc/ufw/sysctl.conf every time it starts and ships log_martians=0, which would silently undo
# the value set by the system role (and make the next run report a change). Keep the two in agreement.
- name: Keep martian packet logging enabled when UFW applies its sysctl file
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: '^#?{{ item }}='
    line: "{{ item }}=1"
  loop:
    - net/ipv4/conf/all/log_martians
    - net/ipv4/conf/default/log_martians

- name: Enable the firewall
  community.general.ufw:
    state: enabled
