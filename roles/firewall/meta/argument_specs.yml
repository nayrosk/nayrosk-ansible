---
argument_specs:
  main:
    short_description: Enable UFW with a default deny policy and the SSH and Caddy rules.
    description:
      - Sets the UFW default policies (deny incoming, allow outgoing), applies the fixed rules (C(OpenSSH),
        C(80/tcp), C(443/tcp), C(443/udp)) then C(firewall_rules_extra), checks that the OpenSSH rule exists
        and enables UFW last, so the current SSH session is never cut.
      - The fixed rules live in C(vars/main.yml) as C(firewall_fixed_rules) and are always applied.
    options:
      firewall_rules_extra:
        type: list
        elements: dict
        default: []
        description:
          - Additional UFW rules, applied in order after the fixed rules. Each item takes the options of
            C(community.general.ufw) (C(rule), C(name) or C(port), C(proto), C(from_ip), C(to_ip),
            C(direction), C(comment)).
