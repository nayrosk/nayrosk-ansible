---
# Account probed with the SSH key. Follows operator_user_name when the inventory sets it.
bootstrap_connection_operator: "{{ operator_user_name | default('operator') }}"
# Seconds before the operator probe gives up.
bootstrap_connection_probe_timeout: 10
# Account used with a password while the operator key login does not work yet: root, or a sudo user such as
# the ubuntu account of a stock install.
bootstrap_connection_user: root
# Password of the bootstrap user, also used for sudo when that user is not root. vault_root_password is the
# older name and stays accepted.
bootstrap_connection_password: "{{ vault_bootstrap_password | default(vault_root_password | default('')) }}"
