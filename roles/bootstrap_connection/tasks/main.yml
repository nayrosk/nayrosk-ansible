---
# The probe must never fall back to a password or prompt: it forces public key authentication in
# batch mode and clears the password. The inventory SSH options are read through hostvars: a task var
# named like the one it extends would recurse.
- name: Probe operator key login
  ansible.builtin.ping:
  vars:
    ansible_user: "{{ bootstrap_connection_operator }}"
    ansible_password: ""
    ansible_become: false
    ansible_ssh_common_args: >-
      {{ hostvars[inventory_hostname].ansible_ssh_common_args | default('') }}
      -o PreferredAuthentications=publickey -o BatchMode=yes
      -o ConnectTimeout={{ bootstrap_connection_probe_timeout }}
  ignore_unreachable: true
  register: bootstrap_connection_probe
  changed_when: false

# This task and the root password check clear ansible_password: the inventory may set it from
# vault_root_password, and templating it while that variable is missing would fail before the check can
# explain the problem.
- name: Select connection mode
  vars:
    ansible_password: ""
  ansible.builtin.set_fact:
    bootstrap_connection_mode: "{{ 'root' if bootstrap_connection_probe.unreachable | default(false) else 'operator' }}"

# The inventory may set ansible_password for the root fallback: clear it so the operator connection is
# key-only (no sshpass wrapper) and privilege escalation uses the passwordless sudo rule.
- name: Use operator with become
  ansible.builtin.set_fact:
    ansible_user: "{{ bootstrap_connection_operator }}"
    ansible_password: ""
    ansible_become: true
  when: bootstrap_connection_mode == 'operator'

- name: Check the root password is available for the fallback
  vars:
    ansible_password: ""
  ansible.builtin.assert:
    that: vault_root_password is defined
    fail_msg: >-
      The operator key login failed and vault_root_password is not defined: set it in the inventory vault for
      the first run, or fix the operator key.
    quiet: true
  when: bootstrap_connection_mode == 'root'

- name: Use root with password
  ansible.builtin.set_fact:
    ansible_user: root
    ansible_password: "{{ vault_root_password }}"
    ansible_become: false
  when: bootstrap_connection_mode == 'root'
  no_log: true

- name: Report connection mode
  ansible.builtin.debug:
    msg: "bootstrap_connection_mode={{ bootstrap_connection_mode }}"

- name: Reset connection
  ansible.builtin.meta: reset_connection

- name: Gather facts
  ansible.builtin.setup:
