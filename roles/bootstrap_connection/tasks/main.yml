---
# The probe must never fall back to a password or prompt: it forces public key authentication in
# batch mode and clears the password. The inventory SSH options are read through hostvars: a task var
# named like the one it extends would recurse.
- name: Probe operator key login
  ansible.builtin.ping:
  vars:
    ansible_user: "{{ bootstrap_connection_operator }}"
    ansible_password: ""
    ansible_become: false
    ansible_ssh_common_args: >-
      {{ hostvars[inventory_hostname].ansible_ssh_common_args | default('') }}
      -o PreferredAuthentications=publickey -o BatchMode=yes
      -o ConnectTimeout={{ bootstrap_connection_probe_timeout }}
  ignore_unreachable: true
  register: bootstrap_connection_probe
  changed_when: false

# This task and the bootstrap password check clear ansible_password: the inventory may set it from
# vault_root_password, and templating it while that variable is missing would fail before the check can
# explain the problem.
- name: Select connection mode
  vars:
    ansible_password: ""
  ansible.builtin.set_fact:
    bootstrap_connection_mode: >-
      {{ 'bootstrap' if bootstrap_connection_probe.unreachable | default(false) else 'operator' }}

# The inventory may set ansible_password for the bootstrap fallback: clear it so the operator connection is
# key-only (no sshpass wrapper) and privilege escalation uses the passwordless sudo rule.
- name: Use operator with become
  ansible.builtin.set_fact:
    ansible_user: "{{ bootstrap_connection_operator }}"
    ansible_password: ""
    ansible_become: true
    ansible_become_password: ""
  when: bootstrap_connection_mode == 'operator'

- name: Check the bootstrap password is available for the fallback
  vars:
    ansible_password: ""
  ansible.builtin.assert:
    that: bootstrap_connection_password | default('') | length > 0
    fail_msg: >-
      The operator key login failed and no bootstrap password is set: define vault_bootstrap_password (or the
      older vault_root_password) in the inventory vault for the first run, or fix the operator key.
    quiet: true
  when: bootstrap_connection_mode == 'bootstrap'

# A user other than root reaches root through sudo with its own password, as on a stock Ubuntu install.
- name: Use the bootstrap user with its password
  ansible.builtin.set_fact:
    ansible_user: "{{ bootstrap_connection_user }}"
    ansible_password: "{{ bootstrap_connection_password }}"
    ansible_become: "{{ bootstrap_connection_user != 'root' }}"
    ansible_become_password: "{{ bootstrap_connection_password if bootstrap_connection_user != 'root' else '' }}"
  when: bootstrap_connection_mode == 'bootstrap'
  no_log: true

- name: Report connection mode
  ansible.builtin.debug:
    msg: "bootstrap_connection_mode={{ bootstrap_connection_mode }}"

- name: Reset connection
  ansible.builtin.meta: reset_connection

- name: Gather facts
  ansible.builtin.setup:

# Every mode reaches root, directly or through become. With pipelining, the first module that needs a
# temporary directory creates /root/.ansible/tmp itself and warns about it: create it beforehand.
- name: Create the Ansible temporary directory of root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /root/.ansible
    - /root/.ansible/tmp
