---
# pro status queries the Canonical contracts API on an unattached host. That API fails now and then (HTTP 502):
# retry instead of failing the play.
- name: Read the Ubuntu Pro status
  ansible.builtin.command: pro status --format json
  register: ubuntu_pro_status_raw
  changed_when: false
  retries: 5
  delay: 5
  until: ubuntu_pro_status_raw.rc == 0

- name: Parse the Ubuntu Pro status
  ansible.builtin.set_fact:
    ubuntu_pro_status: "{{ ubuntu_pro_status_raw.stdout | from_json }}"

# The token is briefly visible in the process list while pro attach runs. Accepted tradeoff against
# writing it to a temporary --attach-config file.
- name: Attach Ubuntu Pro
  ansible.builtin.command:
    argv:
      - pro
      - attach
      - --no-auto-enable
      - "{{ ubuntu_pro_token }}"
  changed_when: true
  no_log: true
  when:
    - first_install | default(false) | bool
    - ubuntu_pro_token | length > 0
    - not ubuntu_pro_status.attached

- name: Read the Ubuntu Pro status after attaching
  ansible.builtin.command: pro status --format json
  register: ubuntu_pro_status_after
  changed_when: false
  retries: 5
  delay: 5
  until: ubuntu_pro_status_after.rc == 0
  when: ubuntu_pro_livepatch | bool

- name: Parse the Ubuntu Pro status after attaching
  ansible.builtin.set_fact:
    ubuntu_pro_status: "{{ ubuntu_pro_status_after.stdout | from_json }}"
  when: ubuntu_pro_livepatch | bool

- name: Set the Livepatch enabled fact
  ansible.builtin.set_fact:
    ubuntu_pro_livepatch_enabled: >-
      {{ ubuntu_pro_status.services
         | selectattr('name', 'equalto', 'livepatch')
         | selectattr('status', 'defined')
         | selectattr('status', 'equalto', 'enabled') | list | length > 0 }}
  when: ubuntu_pro_livepatch | bool

- name: Enable Livepatch
  ansible.builtin.command: pro enable livepatch --assume-yes
  changed_when: true
  when:
    - ubuntu_pro_livepatch | bool
    - ubuntu_pro_status.attached | bool
    - not (ubuntu_pro_livepatch_enabled | bool)
