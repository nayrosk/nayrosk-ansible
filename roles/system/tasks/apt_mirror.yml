---
- name: Measure the APT mirrors
  block:
    - name: Detect the country from the public IP
      ansible.builtin.uri:
        url: https://ifconfig.co/country-iso
        return_content: true
      register: system_country
      changed_when: false
      failed_when: false
      when: system_apt_mirror_country | length == 0

    - name: Set the mirror country code
      ansible.builtin.set_fact:
        system_country_code: >-
          {{ (system_apt_mirror_country | length > 0) | ternary(system_apt_mirror_country,
          (system_country.content | default('')) | trim | upper) }}

    - name: Fetch the country mirror list
      ansible.builtin.uri:
        url: "http://mirrors.ubuntu.com/{{ system_country_code }}.txt"
        return_content: true
      register: system_mirror_list
      changed_when: false
      failed_when: false
      when: system_country_code | regex_search('^[A-Z]{2}$') is not none

    - name: Time the Release file of each mirror
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --fail
          - --output
          - /dev/null
          - --write-out
          - "%{http_code} %{time_total}"
          - --max-time
          - "5"
          - "{{ item }}dists/{{ ansible_facts.distribution_release }}/Release"
      register: system_mirror_times
      changed_when: false
      failed_when: false
      loop: >-
        {{ (system_mirror_list.content | default('')).split() | select('match', '^https?://')
        | map('trim') | map('regex_replace', '/+$', '') | map('regex_replace', '$', '/') | list }}

    - name: Keep the fastest mirror answering HTTP 200 or fall back to the default
      ansible.builtin.set_fact:
        system_apt_mirror: >-
          {%- set ns = namespace(best=none, best_time=none) -%}
          {%- for r in system_mirror_times.results | default([]) if r.rc == 0 and (r.stdout.split() | length) == 2
              and r.stdout.split()[0] == '200' -%}
          {%- set t = r.stdout.split()[1] | float -%}
          {%- if ns.best_time is none or t < ns.best_time -%}
          {%- set ns.best = r.item -%}{%- set ns.best_time = t -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ns.best if ns.best is not none else (system_apt_mirror_default | trim | regex_replace('/+$', '')) ~ '/' }}
