---
argument_specs:
  main:
    short_description: Deploy user dotfiles.
    description:
      - Writes a C(.vimrc) in the home directory of each listed user. The users must already exist.
    options:
      user_customization_vimrc:
        type: str
        description: Content of the C(.vimrc) written for every listed user. See the role defaults.
        default: "see defaults/main.yml"
      user_customization_users:
        type: list
        elements: dict
        default:
          - name: root
            home: /root
          - name: operator
            home: /home/operator
        description: Users receiving the C(.vimrc). The name is also the file owner and group.
        options:
          name:
            type: str
            required: true
            description: Account name, used as owner and group.
          home:
            type: str
            required: true
            description: Home directory holding the C(.vimrc).
