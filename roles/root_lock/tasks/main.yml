---
# Locking root removes the last password login: the play must already reach the host through the operator
# key, and the operator must keep full administrative rights.
- name: Lock the root password
  when: root_lock_enabled | bool
  block:
    # A tagged run skips ssh_hardening and its switch to the operator. If the operator probe failed, the play
    # still connects as root with the password and locking root would cut that connection.
    - name: Check the play connects as the operator
      ansible.builtin.assert:
        that: ansible_user == root_lock_operator
        fail_msg: >-
          The play connects as {{ ansible_user }}, not as {{ root_lock_operator }}: refusing to lock root.
          Run the full playbook, or fix the operator key login first.
        quiet: true

    - name: List the operator sudo rights
      ansible.builtin.command:
        argv: [sudo, -n, -u, "{{ root_lock_operator }}", sudo, -n, -l]
      register: root_lock_sudo_rights
      changed_when: false

    # sudo -n true alone would pass with a rule limited to that command.
    - name: Check the operator has passwordless sudo for every command
      ansible.builtin.assert:
        that: root_lock_sudo_rights.stdout is search('\(ALL(\s*:\s*ALL)?\)\s+NOPASSWD:\s*ALL\s*$', multiline=true)
        fail_msg: "{{ root_lock_operator }} has no NOPASSWD: ALL sudo rule: refusing to lock root."
        quiet: true

    - name: Lock the root password with usermod -L
      ansible.builtin.user:
        name: root
        password_lock: true
