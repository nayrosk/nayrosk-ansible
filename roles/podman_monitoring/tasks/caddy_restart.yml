---
# Included from the Restart caddy handler with ansible_become and ansible_become_user set to the operator.
- name: Restart the Caddy user unit
  ansible.builtin.systemd_service:
    name: caddy.service
    scope: user
    state: restarted
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_monitoring_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_monitoring_user_uid }}/bus"
