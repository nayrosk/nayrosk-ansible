---
# Read-only. Fills the inputs of bridge_config.yml and bridge_apply.yml from the host.
# The uplink: libvirt_bridge_interface when set, else the single member of the bridge when it already exists
# (later runs: the default route is on the bridge), else the interface of the default route (first run).
- name: List the members of the bridge
  ansible.builtin.find:
    paths: "/sys/class/net/{{ libvirt_bridge_name }}/brif"
    file_type: any
  register: libvirt_bridge_members

- name: Resolve the uplink interface
  ansible.builtin.set_fact:
    libvirt_bridge_uplink: >-
      {{ libvirt_bridge_interface
         if libvirt_bridge_interface | length > 0
         else (libvirt_bridge_members.files[0].path | basename
               if libvirt_bridge_members.matched == 1
               else ansible_facts.default_ipv4.interface) }}

- name: Check that the uplink is a physical interface, not the bridge itself
  ansible.builtin.assert:
    that:
      - libvirt_bridge_uplink != libvirt_bridge_name
      - libvirt_bridge_members.matched <= 1
    fail_msg: >-
      Cannot tell which interface to bridge ({{ libvirt_bridge_name }} has {{ libvirt_bridge_members.matched }}
      members). Set libvirt_bridge_interface.
    quiet: true

- name: Read the uplink MAC address
  ansible.builtin.slurp:
    src: "/sys/class/net/{{ libvirt_bridge_uplink }}/address"
  register: libvirt_bridge_mac_raw

# The 60 file is the one this role writes: leaving it out gives the same source on every run.
- name: List the netplan files
  ansible.builtin.find:
    paths: /etc/netplan
    patterns: ["*.yaml"]
    excludes: [60-libvirt-bridge.yaml]
  register: libvirt_bridge_netplan_files

- name: Read the netplan files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: "{{ libvirt_bridge_netplan_files.files | map(attribute='path') | sort }}"
  register: libvirt_bridge_netplan_raw
  no_log: true

# netplan merges files in lexical order. The uplink entry is the one whose id, set-name or match.macaddress
# names the uplink. Its id is reused in the 60 file so netplan merges the override into it.
- name: Find the netplan entry of the uplink
  vars:
    libvirt_bridge_mac_read: "{{ libvirt_bridge_mac_raw.content | b64decode | trim }}"
    libvirt_bridge_all_ethernets: >-
      {{ libvirt_bridge_netplan_raw.results
         | map(attribute='content') | map('b64decode') | map('from_yaml')
         | map(attribute='network', default={}) | map(attribute='ethernets', default={})
         | list }}
    libvirt_bridge_merged: >-
      {{ libvirt_bridge_all_ethernets | ansible.builtin.combine(recursive=true, list_merge='replace')
         if libvirt_bridge_all_ethernets | length > 0 else {} }}
    libvirt_bridge_ids: >-
      {{ libvirt_bridge_merged | dict2items
         | selectattr('key', 'equalto', libvirt_bridge_uplink)
         | list
         + (libvirt_bridge_merged | dict2items
            | selectattr('value.set-name', 'defined')
            | selectattr('value.set-name', 'equalto', libvirt_bridge_uplink) | list)
         + (libvirt_bridge_merged | dict2items
            | selectattr('value.match.macaddress', 'defined')
            | selectattr('value.match.macaddress', 'equalto', libvirt_bridge_mac_read) | list) }}
  ansible.builtin.set_fact:
    libvirt_bridge_mac: "{{ libvirt_bridge_mac_read }}"
    libvirt_bridge_netplan_id: "{{ (libvirt_bridge_ids | first).key if libvirt_bridge_ids else '' }}"
    libvirt_bridge_uplink_source: "{{ (libvirt_bridge_ids | first).value if libvirt_bridge_ids else {} }}"
    libvirt_bridge_expected_ipv4: "{{ ansible_facts.default_ipv4.address }}"
    libvirt_bridge_gateway: "{{ ansible_facts.default_ipv4.gateway }}"
  no_log: true

- name: Check that netplan configures the uplink
  ansible.builtin.assert:
    that: libvirt_bridge_netplan_id | length > 0
    fail_msg: >-
      No entry in /etc/netplan configures {{ libvirt_bridge_uplink }}. The role only bridges an uplink that
      netplan manages; leave libvirt_bridge_enabled false on this host.
    quiet: true
