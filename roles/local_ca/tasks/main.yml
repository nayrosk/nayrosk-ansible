---
- name: Install the python cryptography library
  ansible.builtin.apt:
    name: python3-cryptography
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

# IPv6-only hosts have no default_ipv4: their default IPv6 address is the local IP then.
- name: Set the local IP fact
  ansible.builtin.set_fact:
    local_ca_local_ip: >-
      {{ ansible_facts.default_ipv4.address
         if ansible_facts.default_ipv4.address is defined
         else ansible_facts.default_ipv6.address | default('') }}

- name: Check whether a server certificate exists
  ansible.builtin.stat:
    path: "{{ local_ca_directory }}/server.crt"
  register: local_ca_server_stat

- name: Read the existing server certificate
  community.crypto.x509_certificate_info:
    path: "{{ local_ca_directory }}/server.crt"
    valid_at:
      soon: +30d
  register: local_ca_server_info
  when: local_ca_server_stat.stat.exists

- name: Detect the public IPv4 address from the target
  ansible.builtin.uri:
    url: "{{ local_ca_public_ip_probe_url }}"
    return_content: true
    timeout: 10
  register: local_ca_public_ip_probe
  changed_when: false
  failed_when: false
  when: local_ca_public_ip_override | length == 0

# Order: the inventory override, then a valid IPv4 answer of the probe, then the first IP address already in
# the server certificate other than the local IP, so a failed probe does not reissue the certificate,
# then ansible_host when it is an IP literal, else no public IP.
- name: Set the public IP fact
  vars:
    local_ca_ipv4_regex: >-
      ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
    local_ca_probe_answer: "{{ local_ca_public_ip_probe.content | default('') | trim }}"
    local_ca_existing_ips: >-
      {{ local_ca_server_info.subject_alt_name | default([]) | select('match', '^IP:')
         | map('regex_replace', '^IP:', '') | reject('equalto', local_ca_local_ip) | list }}
    local_ca_host: "{{ ansible_host | default('') | string }}"
    local_ca_host_is_ip: >-
      {{ local_ca_host is match(local_ca_ipv4_regex) or local_ca_host is match('^[0-9a-fA-F:]*:[0-9a-fA-F:.]*$') }}
  ansible.builtin.set_fact:
    local_ca_public_ip: >-
      {%- if local_ca_public_ip_override | length > 0 -%}
      {{ local_ca_public_ip_override }}
      {%- elif (local_ca_public_ip_probe.status | default(0)) == 200
               and local_ca_probe_answer is match(local_ca_ipv4_regex) -%}
      {{ local_ca_probe_answer }}
      {%- elif local_ca_existing_ips | length > 0 -%}
      {{ local_ca_existing_ips | first }}
      {%- elif local_ca_host_is_ip | bool -%}
      {{ local_ca_host }}
      {%- endif -%}

- name: Build the subject alternative names
  ansible.builtin.set_fact:
    local_ca_san: >-
      {{ (['DNS:' ~ hostname]
          + (([local_ca_local_ip, local_ca_public_ip] | select | unique)
             | map('regex_replace', '^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+|[0-9a-fA-F:]*:[0-9a-fA-F:]*)$', 'IP:\1')
             | map('regex_replace', '^([^:]*[^0-9A-Fa-f:.][^:]*)$', 'DNS:\1')
             | list)) | unique }}

- name: Create the CA directory
  ansible.builtin.file:
    path: "{{ local_ca_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate the CA private key
  community.crypto.openssl_privatekey:
    path: "{{ local_ca_directory }}/ca.key"
    type: ECC
    curve: secp384r1
    mode: "0600"
    owner: root
    group: root
    force: "{{ local_ca_force_regenerate | bool }}"
  no_log: true

- name: Generate the CA certificate signing request
  community.crypto.openssl_csr:
    path: "{{ local_ca_directory }}/ca.csr"
    privatekey_path: "{{ local_ca_directory }}/ca.key"
    common_name: "{{ hostname }} local CA"
    basic_constraints: ["CA:TRUE"]
    basic_constraints_critical: true
    key_usage: [keyCertSign, cRLSign]
    key_usage_critical: true
    mode: "0644"

- name: Generate the self-signed CA certificate
  community.crypto.x509_certificate:
    path: "{{ local_ca_directory }}/ca.crt"
    csr_path: "{{ local_ca_directory }}/ca.csr"
    privatekey_path: "{{ local_ca_directory }}/ca.key"
    provider: selfsigned
    selfsigned_not_after: +3650d
    mode: "0644"
    owner: root
    group: root
  no_log: true

- name: Generate the server private key
  community.crypto.openssl_privatekey:
    path: "{{ local_ca_directory }}/server.key"
    type: ECC
    curve: secp384r1
    mode: "0600"
    owner: root
    group: root
  no_log: true

- name: Generate the server certificate signing request
  community.crypto.openssl_csr:
    path: "{{ local_ca_directory }}/server.csr"
    privatekey_path: "{{ local_ca_directory }}/server.key"
    common_name: "{{ hostname }}"
    subject_alt_name: "{{ local_ca_san }}"
    mode: "0644"

- name: Issue the server certificate
  community.crypto.x509_certificate:
    path: "{{ local_ca_directory }}/server.crt"
    csr_path: "{{ local_ca_directory }}/server.csr"
    provider: ownca
    ownca_path: "{{ local_ca_directory }}/ca.crt"
    ownca_privatekey_path: "{{ local_ca_directory }}/ca.key"
    ownca_not_after: +365d
    force: "{{ not (local_ca_server_info.valid_at.soon | default(true)) }}"
    mode: "0644"
    owner: root
    group: root
  no_log: true

- name: Install the CA certificate in the system trust store
  ansible.builtin.copy:
    src: "{{ local_ca_directory }}/ca.crt"
    dest: /usr/local/share/ca-certificates/local-ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify: Update CA certificates

- name: Fetch the CA certificate to the controller
  ansible.builtin.fetch:
    src: "{{ local_ca_directory }}/ca.crt"
    dest: "{{ playbook_dir }}/../artifacts/{{ inventory_hostname }}/ca.crt"
    flat: true
