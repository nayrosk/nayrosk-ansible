---
# Example inventory. Copy this directory, for example to inventories/prod, and edit the copy.
#   cp -r inventories/example inventories/prod
# Then run: make run INVENTORY=inventories/prod
all:
  hosts:
    # One host per machine. The name is also used for artifacts/<name>/ca.crt on the controller.
    server1:
      # Address or DNS name Ansible connects to. 203.0.113.0/24 is a documentation range: replace it.
      ansible_host: 203.0.113.10
      # ansible_port: 22
