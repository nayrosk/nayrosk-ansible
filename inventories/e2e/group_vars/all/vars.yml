---
# End-to-end test inventory: a throwaway qemu VM reached through port forwards on 127.0.0.1.
e2e: true
hostname: e2e-host
operator_public_key: "{{ lookup('file', inventory_dir + '/.ssh/id_ed25519.pub') }}"
ansible_ssh_private_key_file: "{{ inventory_dir }}/.ssh/id_ed25519"

# The VM gets a new host key on every boot: host key checks are relaxed for this inventory only.
ansible_host_key_checking: false
ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# The first run enters as the ubuntu user with its password and sudo, as on a stock install. The
# bootstrap_connection role picks it while the operator key does not work, and bootstrap_user_cleanup
# removes it once the operator works. vault_root_password stays in the vault for the root login checks.
bootstrap_connection_user: ubuntu

# Caddy basic auth user; the password is e2e-password (bcrypt hash in vault_caddy_basic_auth_hash).
podman_monitoring_caddy_basic_auth_user: e2e
