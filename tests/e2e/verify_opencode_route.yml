---
# opencode is not installed in the VM: a stub HTTP server on the opencode port stands in for it. The checks
# prove that Caddy skips its basic auth on the route only and strips the prefix.
- name: Verify the opencode route on the end-to-end host
  hosts: opencode
  gather_facts: false
  vars:
    verify_ca_path: "{{ playbook_dir }}/../../artifacts/{{ inventory_hostname }}/ca.crt"
    verify_stub_root: /run/opencode-route-stub
    verify_caddy_curl:
      - curl
      - -s
      - -o
      - /dev/null
      - -w
      - "%{http_code}"
      - --cacert
      - "{{ verify_ca_path }}"
      - --resolve
      - "{{ hostname }}:8443:127.0.0.1"
  roles:
    - role: bootstrap_connection
      tags: [always, bootstrap_connection]
  tasks:
    - name: Create the stub document root
      ansible.builtin.file:
        path: "{{ verify_stub_root }}/api"
        state: directory
        mode: "0755"

    - name: Write the stub API answer
      ansible.builtin.copy:
        content: '{"stub":true}'
        dest: "{{ verify_stub_root }}/api/info"
        mode: "0644"

    - name: Start the stub backend on the opencode port
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=opencode-route-stub
          - --property=DynamicUser=yes
          - python3
          - -m
          - http.server
          - --bind
          - 127.0.0.1
          - --directory
          - "{{ verify_stub_root }}"
          - "{{ opencode_route_port | default(4096) }}"
      changed_when: true

    - name: Verify the route and the basic auth of the other paths
      block:
        - name: Request the stub API through the route without the Caddy credentials
          ansible.builtin.command:
            argv: >-
              {{ ['curl', '-s', '--cacert', verify_ca_path, '--resolve', hostname ~ ':8443:127.0.0.1',
                  '-w', ' %{http_code}', 'https://' ~ hostname ~ ':8443/opencode/api/info'] }}
          delegate_to: localhost
          become: false
          register: verify_opencode_route
          changed_when: false
          retries: 10
          delay: 3
          until: verify_opencode_route.stdout == '{"stub":true} 200'

        - name: Request paths that keep the Caddy basic auth, without credentials
          ansible.builtin.command:
            argv: "{{ verify_caddy_curl + ['https://' ~ hostname ~ ':8443' ~ item] }}"
          delegate_to: localhost
          become: false
          loop:
            - /node_exporter
            - /opencode
            - /opencodex/api/info
          register: verify_opencode_protected
          changed_when: false

        - name: Check only the route skips the Caddy basic auth
          ansible.builtin.assert:
            that: verify_opencode_protected.results | map(attribute='stdout') | unique == ['401']
            fail_msg: >-
              Status codes without credentials for /node_exporter, /opencode and /opencodex/api/info:
              {{ verify_opencode_protected.results | map(attribute='stdout') | join(', ') }}
            quiet: true
      always:
        - name: Stop the stub backend
          ansible.builtin.systemd_service:
            name: opencode-route-stub.service
            state: stopped

        - name: Remove the stub document root
          ansible.builtin.file:
            path: "{{ verify_stub_root }}"
            state: absent
