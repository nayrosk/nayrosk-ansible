---
# Checks how the libvirt role finds the uplink entry in the netplan files, without a target:
#   make unit
- name: Check the libvirt bridge source
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    unit_installer:
      network:
        version: 2
        ethernets:
          enp17s0:
            match: {macaddress: "10:ff:e0:b0:fc:5c"}
            set-name: enp17s0
            dhcp4: true
            dhcp6: true
    unit_cases:
      - name: installer entry found by id, set-name and MAC
        docs: ["{{ unit_installer }}"]
        current: {}
        expected_id: enp17s0
        expected_source: {match: {macaddress: "10:ff:e0:b0:fc:5c"}, set-name: enp17s0, dhcp4: true, dhcp6: true}
        expected_static_keys: []
      - name: entry found by its MAC under another id, MAC case ignored
        docs:
          - network: {ethernets: {lan: {match: {macaddress: "10:FF:E0:B0:FC:5C"}, dhcp4: true}}}
        current: {}
        expected_id: lan
        expected_source: {match: {macaddress: "10:FF:E0:B0:FC:5C"}, dhcp4: true}
        expected_static_keys: []
      - name: entry found by match.name glob
        docs:
          - network: {ethernets: {wired: {match: {name: "enp1*"}, dhcp4: true}}}
        current: {}
        expected_id: wired
        expected_source: {match: {name: "enp1*"}, dhcp4: true}
        expected_static_keys: []
      - name: lists from several files are concatenated, as netplan does
        docs:
          - network: {ethernets: {enp17s0: {addresses: [192.0.2.10/24], nameservers: {addresses: [192.0.2.1]}}}}
          - network: {ethernets: {enp17s0: {addresses: ["2001:db8::10/64"], routes: [{to: default, via: 192.0.2.1}]}}}
        current: {}
        expected_id: enp17s0
        expected_source:
          addresses: [192.0.2.10/24, "2001:db8::10/64"]
          nameservers: {addresses: [192.0.2.1]}
          routes: [{to: default, via: 192.0.2.1}]
        expected_static_keys: [addresses, nameservers, routes]
      - name: static host on a later run, its settings already moved to the bridge
        docs:
          - network: {ethernets: {enp17s0: {match: {macaddress: "10:ff:e0:b0:fc:5c"}, set-name: enp17s0}}}
        current:
          network:
            ethernets: {enp17s0: {dhcp4: false, dhcp6: false}}
            bridges:
              br0:
                interfaces: [enp17s0]
                macaddress: "10:ff:e0:b0:fc:5c"
                addresses: [192.0.2.10/24]
                routes: [{to: default, via: 192.0.2.1}]
        expected_id: enp17s0
        expected_source:
          match: {macaddress: "10:ff:e0:b0:fc:5c"}
          set-name: enp17s0
          addresses: [192.0.2.10/24]
          routes: [{to: default, via: 192.0.2.1}]
        expected_static_keys: []
      - name: DHCP and static host on a later run, its static settings already moved to the bridge
        docs:
          - network: {ethernets: {enp17s0: {set-name: enp17s0, dhcp4: true}}}
        current:
          network:
            ethernets: {enp17s0: {dhcp4: false, dhcp6: false}}
            bridges:
              br0:
                interfaces: [enp17s0]
                macaddress: "10:ff:e0:b0:fc:5c"
                dhcp4: true
                dhcp-identifier: mac
                addresses: [192.0.2.10/24]
                routes: [{to: 198.51.100.0/24, via: 192.0.2.254}]
        expected_id: enp17s0
        expected_source:
          set-name: enp17s0
          dhcp4: true
          addresses: [192.0.2.10/24]
          routes: [{to: 198.51.100.0/24, via: 192.0.2.254}]
        expected_static_keys: []
      - name: entry found by a match.name glob with a bracket expression
        docs:
          - network: {ethernets: {wired: {match: {name: "enp1[78]s0"}, dhcp4: true}}}
        current: {}
        expected_id: wired
        expected_source: {match: {name: "enp1[78]s0"}, dhcp4: true}
        expected_static_keys: []
      - name: every match property must match, as netplan requires
        docs:
          - network:
              ethernets:
                first: {match: {name: "enp1[78]s0", macaddress: "10:ff:e0:b0:fc:5c"}, dhcp4: true}
                second: {match: {name: "enp1[78]s0", macaddress: "02:00:00:00:00:02"}, dhcp4: true}
        current: {}
        expected_id: first
        expected_source: {match: {name: "enp1[78]s0", macaddress: "10:ff:e0:b0:fc:5c"}, dhcp4: true}
        expected_static_keys: []
      - name: a match on the driver alone
        docs:
          - network:
              ethernets:
                aq: {match: {driver: atlantic}, dhcp4: true}
                other: {match: {driver: r8169}, dhcp4: true}
        current: {}
        expected_id: aq
        expected_source: {match: {driver: atlantic}, dhcp4: true}
        expected_static_keys: []
      - name: a match on a driver list
        docs:
          - network:
              ethernets:
                aq: {match: {driver: [atlantic, r8169]}, dhcp4: true}
                other: {match: {driver: [igb, e1000e]}, dhcp4: true}
        current: {}
        expected_id: aq
        expected_source: {match: {driver: [atlantic, r8169]}, dhcp4: true}
        expected_static_keys: []
      - name: a match on a driver glob
        docs:
          - network:
              ethernets:
                aq: {match: {driver: "atl*"}, dhcp4: true}
                other: {match: {driver: "igb*"}, dhcp4: true}
        current: {}
        expected_id: aq
        expected_source: {match: {driver: "atl*"}, dhcp4: true}
        expected_static_keys: []
      - name: an id that names the uplink does not count when the entry has a match
        docs:
          - network:
              ethernets:
                enp17s0: {match: {macaddress: "02:00:00:00:00:02"}, dhcp4: true}
                lan: {match: {macaddress: "10:ff:e0:b0:fc:5c"}, dhcp4: true}
        current: {}
        expected_id: lan
        expected_source: {match: {macaddress: "10:ff:e0:b0:fc:5c"}, dhcp4: true}
        expected_static_keys: []
      - name: two entries match the uplink
        docs:
          - network: {ethernets: {enp17s0: {dhcp4: true}, other: {match: {name: "enp*"}, dhcp4: true}}}
        current: {}
        expected_id: fail
        expected_message: matches several netplan entries
      - name: no entry matches the uplink
        docs:
          - network: {ethernets: {eno1: {dhcp4: true}}}
        current: {}
        expected_id: fail
        expected_message: No entry in /etc/netplan configures enp17s0
  tasks:
    - name: Run each case
      ansible.builtin.include_tasks: libvirt_bridge_source_case.yml
      loop: "{{ unit_cases }}"
      loop_control:
        loop_var: unit_case
        label: "{{ unit_case.name }}"
