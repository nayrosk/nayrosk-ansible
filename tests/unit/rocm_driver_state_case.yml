---
- name: Run the driver state decision
  block:
    - name: Include the driver state decision
      ansible.builtin.include_role:
        name: rocm
        tasks_from: driver_state
      vars:
        rocm_running_kernel: "{{ unit_case.kernel }}"
        rocm_dkms_built_kernels: "{{ unit_case.built }}"
        rocm_loaded_is_dkms: "{{ unit_case.loaded_is_dkms }}"

    - name: Record the state
      ansible.builtin.set_fact:
        unit_outcome: "{{ rocm_driver_state }}"
        unit_message: ""
  rescue:
    - name: Record the failure
      ansible.builtin.set_fact:
        unit_outcome: fail
        unit_message: "{{ ansible_failed_result.msg | default('') }}"

- name: Check the outcome
  ansible.builtin.assert:
    that: unit_outcome == unit_case.expected
    fail_msg: "{{ unit_case.name }}: expected {{ unit_case.expected }}, got {{ unit_outcome }}"
    success_msg: "{{ unit_case.name }}: {{ unit_outcome }}"

- name: Check that the failure names the running kernel
  ansible.builtin.assert:
    that: unit_case.kernel in unit_message
    fail_msg: "{{ unit_case.name }}: message does not name {{ unit_case.kernel }}: {{ unit_message }}"
    success_msg: "{{ unit_case.name }}: {{ unit_message }}"
  when: unit_case.expected == 'fail'
