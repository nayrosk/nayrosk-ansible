---
# Checks that the gpu_metrics_exporter field list is stable and honours the disabled fields, on the controller,
# without a target:
#   make unit
- name: Check the gpu_metrics_exporter field list
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/gpu_metrics_exporter/defaults/main.yml
    - ../../roles/gpu_metrics_exporter/vars/main.yml
  tasks:
    - name: Assert the list is sorted, so the rendered config does not change between runs
      ansible.builtin.assert:
        that: gpu_metrics_exporter_enabled_fields == gpu_metrics_exporter_enabled_fields | sort
        quiet: true

    - name: Assert a disabled field is excluded and an enabled one is kept
      ansible.builtin.assert:
        that:
          - "'GPU_ECC_CORRECT_GFX' not in gpu_metrics_exporter_enabled_fields"
          - "'GPU_XGMI_LINK_RX' not in gpu_metrics_exporter_enabled_fields"
          - "'GPU_EDGE_TEMPERATURE' in gpu_metrics_exporter_enabled_fields"
        quiet: true

    - name: Assert the shuffled input gives the same list
      ansible.builtin.assert:
        that: >-
          gpu_metrics_exporter_enabled_fields ==
          gpu_metrics_exporter_all_fields | shuffle | difference(gpu_metrics_exporter_disabled_fields) | sort
        quiet: true

    - name: Assert disabling every field fails the field check
      block:
        - name: Include the field check with every field disabled
          ansible.builtin.include_role:
            name: gpu_metrics_exporter
            tasks_from: check_fields
          vars:
            gpu_metrics_exporter_disabled_fields: "{{ gpu_metrics_exporter_all_fields }}"
        - name: Record a pass
          ansible.builtin.set_fact:
            unit_all_disabled_outcome: pass
      rescue:
        - name: Record a failure
          ansible.builtin.set_fact:
            unit_all_disabled_outcome: fail

    - name: Assert the all-disabled outcome is a failure
      ansible.builtin.assert:
        that: unit_all_disabled_outcome == 'fail'
        fail_msg: Disabling every field must fail the field check.
        quiet: true

    - name: Assert an empty disabled list passes the field check
      ansible.builtin.include_role:
        name: gpu_metrics_exporter
        tasks_from: check_fields
      vars:
        gpu_metrics_exporter_disabled_fields: []

    - name: Assert the default disabled list passes the field check
      ansible.builtin.include_role:
        name: gpu_metrics_exporter
        tasks_from: check_fields
