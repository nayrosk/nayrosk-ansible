---
name: pr-policy

# Runs on edits too, so fixing the title or the description re-checks the pull request.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title is a Conventional Commit
        # The squash merge uses the title as the commit subject on main.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Pull request title is not a Conventional Commit: $TITLE"
            exit 1
          fi

  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check the pull request closes an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ] || [ "$AUTHOR" = "renovate[bot]" ]; then
            echo "Dependency bot pull request, no issue needed."
            exit 0
          fi
          if printf '%s\n' "$BRANCH" | grep -Eq '^chore/release-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release pull request, no issue needed."
            exit 0
          fi
          count=$(gh pr view "$NUMBER" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Link the issue this pull request resolves, for example with 'Closes #123'."
            exit 1
          fi
          echo "Closes $count issue(s)."

  branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: .github/scripts/check-branch.sh "$BRANCH"

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check signatures, Conventional Commits and attribution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate | python3 .github/scripts/check_commits.py
