---
name: release

# A signed `vX.Y.Z` tag pushed on main creates the GitHub release, with the notes
# that git-cliff renders for that tag from the controller image.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG does not point to a commit on main"
            exit 1
          fi
      - name: Build the controller image
        run: make controller
      - name: Render the release notes
        run: |
          podman run --rm --userns=keep-id -v "$PWD:/work:Z" -w /work localhost/nayrosk-ansible-controller:dev \
            git-cliff --current --strip header > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::git-cliff produced no notes for this tag"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file release-notes.md --verify-tag
